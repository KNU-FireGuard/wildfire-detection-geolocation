services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fireguard}
      POSTGRES_USER: ${DB_USER:-fireguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: fireguard-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-fireguard}
      DB_USER: ${DB_USER:-fireguard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_CALLBACK_TOKEN: ${AI_CALLBACK_TOKEN:?Set AI_CALLBACK_TOKEN}
      ITS_CCTV_API_KEY: ${ITS_CCTV_API_KEY:-}
      AI_MODEL_PATH: /models/best.pt
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER: ${SOLAPI_SENDER:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - type: bind
        source: ${MODEL_FILE:?Set MODEL_FILE to an existing model file}
        target: /models/best.pt
        read_only: true
        bind:
          create_host_path: false
      - app_data:/app/data
      - dem_tiles:/app/ai/.dem_cache
      - skyline_cache:/app/ai/.skyline_cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  web:
    image: fireguard-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:?Set map client ID}
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:?Set an approved WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
  app_data:
  dem_tiles:
  skyline_cache:
